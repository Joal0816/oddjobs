<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08080a" />
    <title>oddJobs — You're offline</title>
    <style>
      :root {
        --bg: #08080a;
        --amber: #ff9900;
        --text: #f4f4f5;
        --muted: #a1a1aa;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      main { max-width: 28rem; }
      .mark {
        font-size: clamp(2.5rem, 12vw, 4rem);
        font-weight: 800;
        letter-spacing: -0.03em;
        color: var(--amber);
      }
      h1 { font-size: 1.35rem; margin: 0.75rem 0 0.5rem; }
      p { color: var(--muted); line-height: 1.6; margin: 0 0 1.5rem; }
      button {
        background: var(--amber);
        color: #08080a;
        border: 0;
        border-radius: 9999px;
        padding: 0.75rem 1.75rem;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover { filter: brightness(1.1); }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">oddJobs</div>
      <h1>You're offline</h1>
      <p>
        No connection right now. Your previously visited pages may still be
        available — reconnect and try again.
      </p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
